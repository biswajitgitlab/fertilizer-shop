<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarkar Fertilizer — Intelligent Agri Ecosystem</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020d09;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes spinPreloader {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseLogo {
        0% { transform: scale(0.92); opacity: 0.75; }
        100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(52, 211, 153, 0.8)); }
      }
      @keyframes shimmerPreloader {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%, #064e3b 0%, #021a14 65%, #010b08 100%);z-index:9999;color:#fff;">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;">
          <!-- Outer glowing spinning ring -->
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#10b981;border-right-color:#34d399;animation:spinPreloader 0.85s linear infinite;filter:drop-shadow(0 0 12px rgba(16,185,129,0.5));"></div>
          <!-- Inner pulsing ring -->
          <div style="position:absolute;inset:8px;border-radius:50%;border:2px dashed rgba(52,211,153,0.3);animation:spinPreloader 2.5s linear infinite reverse;"></div>
          <!-- Sprout Logo SVG Icon -->
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:pulseLogo 1.5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px rgba(16,185,129,0.6));">
            <path d="M7 20h10" />
            <path d="M12 20v-8" />
            <path d="M12 12C12 7 7 4 2 5c0 5 3 10 10 7Z" />
            <path d="M12 12c0-5 5-8 10-7 0 5-3 10-10 7Z" />
          </svg>
        </div>
        
        <!-- Branding & Progress Indicator -->
        <div style="margin-top:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <span style="font-size:14px;font-weight:900;letter-spacing:0.25em;color:#ecfdf5;text-transform:uppercase;text-shadow:0 0 16px rgba(16,185,129,0.4);">
            Sarkar Fertilizer
          </span>
          <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;color:#6ee7b7;opacity:0.8;text-transform:uppercase;">
            Intelligent Agri Ecosystem
          </span>
          <div style="width:140px;height:3px;background:rgba(16,185,129,0.15);border-radius:99px;margin-top:12px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg, transparent, #10b981, #6ee7b7, transparent);animation:shimmerPreloader 1.2s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
